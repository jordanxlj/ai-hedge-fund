name: cicd

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      run_multirepo:
        description: "Run multi-repo build"
        type: boolean
        default: false
      run_tagging:
        description: "Create git tag for version"
        type: boolean
        default: false
      release_version:
        description: "Override version (e.g. 1.2.3). Optional."
        required: false
        default: ""
      multirepo_config:
        description: "Path to multi-repo config file"
        required: false
        default: ".github/cicd/multirepo.json"

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis and metrics
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install analysis tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff radon lizard
      - name: Run analysis
        run: |
          set -euo pipefail
          mkdir -p reports
          ruff check src tests --exit-zero --statistics | tee reports/ruff.txt
          radon cc -a -s src | tee reports/radon-cc.txt
          radon mi -s src | tee reports/radon-mi.txt
          lizard -C 15 -w src | tee reports/lizard.txt || true
      - name: Upload analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: reports
      - name: Summary
        run: |
          {
            echo "## Static analysis"
            echo ""
            echo "Reports uploaded as build artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

  multi-repo-build:
    name: Multi-repo build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch' && inputs.run_multirepo == true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install poetry
      - name: Build current repo
        run: |
          poetry build
      - name: Resolve version
        id: version
        run: |
          version="${{ inputs.release_version }}"
          if [ -z "$version" ]; then
            version="$(python scripts/cicd/get_version.py)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "CICD_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build multi-repo dependencies
        env:
          CICD_GH_TOKEN: ${{ secrets.CICD_GH_TOKEN }}
        run: |
          python scripts/cicd/multirepo_build.py --config "${{ inputs.multirepo_config }}"
      - name: Summary
        run: |
          {
            echo "## Multi-repo build"
            echo ""
            echo "Version: ${{ steps.version.outputs.version }}"
            echo "Config: ${{ inputs.multirepo_config }}"
          } >> "$GITHUB_STEP_SUMMARY"

  tag-version:
    name: Tag version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' && inputs.run_tagging == true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve version
        id: version
        run: |
          version="${{ inputs.release_version }}"
          if [ -z "$version" ]; then
            version="$(python scripts/cicd/get_version.py)"
          fi
          if [ -z "$version" ]; then
            echo "Version not found." >&2
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - name: Create git tag
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists. Skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"
      - name: Summary
        run: |
          echo "Tagged ${{ steps.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
