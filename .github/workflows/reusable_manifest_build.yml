name: Reusable - Manifest build

on:
  workflow_call:
    inputs:
      manifest_path:
        description: "Path to manifest JSON in the caller repo"
        required: true
        type: string
      build_command:
        description: "Command to build/test after repos are fetched"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Fetch repos from manifest
        run: python scripts/cicd/fetch_manifest.py "${{ inputs.manifest_path }}"

      - name: Build / Test
        shell: bash
        run: |
          set -euo pipefail
          ${{ inputs.build_command }}

