name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python - tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "poetry"

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run tests (with coverage)
        run: poetry run pytest --cov-report=xml

      - name: Upload coverage.xml
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  python-metrics:
    name: Python - complexity & metrics (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install metrics tools
        run: python -m pip install --upgrade pip radon lizard

      - name: Run radon (cyclomatic complexity / MI / raw)
        run: |
          mkdir -p reports
          radon cc -s -a src > reports/radon-cc.txt || true
          radon mi -s src > reports/radon-mi.txt || true
          radon raw -s src > reports/radon-raw.txt || true

      - name: Run lizard (complexity)
        run: |
          lizard -C 15 -l python -w src > reports/lizard.txt || true

      - name: Publish summary
        run: |
          {
            echo "## Complexity / Metrics (informational)"
            echo ""
            echo "- Reports uploaded as artifacts: \`python-metrics-reports\`"
            echo "- To enforce gates, set thresholds and remove \`|| true\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: python-metrics-reports
          path: reports/

  frontend:
    name: Frontend - lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: app/frontend/pnpm-lock.yaml

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        continue-on-error: true
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Upload dist/
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: app/frontend/dist
          if-no-files-found: error

